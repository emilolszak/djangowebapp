<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7f1">
    <title>MoneySite</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #172a25;
            --muted: #64736d;
            --green: #176b50;
            --lime: #d7ed78;
            --paper: #f4f7f1;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--paper);
            color: var(--ink);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1160px;
            margin: 0 auto;
            padding: 28px 32px;
        }

        .brand {
            color: var(--ink);
            font-size: 19px;
            font-weight: 700;
            text-decoration: none;
        }

        nav a {
            color: var(--muted);
            font-size: 14px;
            text-decoration: none;
        }

        main {
            display: grid;
            min-height: calc(100vh - 82px);
            max-width: 1160px;
            margin: 0 auto;
            padding: 32px;
            align-items: center;
        }

        .intro {
            max-width: 760px;
            padding: 48px 0 100px;
            animation: appear 500ms ease-out both;
        }

        .eyebrow {
            margin: 0 0 22px;
            color: var(--green);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        h1 {
            max-width: 720px;
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(48px, 7vw, 88px);
            font-weight: 400;
            line-height: 1.02;
        }

        .summary {
            max-width: 480px;
            margin: 28px 0 34px;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.7;
        }

        .action {
            display: inline-flex;
            min-height: 48px;
            align-items: center;
            padding: 0 20px;
            background: var(--green);
            color: white;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        .action:hover { background: #10553f; }
        a:focus-visible { outline: 3px solid #b2c94f; outline-offset: 4px; }

        @keyframes appear {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            header { padding: 22px 20px; }
            main { min-height: calc(100vh - 68px); padding: 20px; }
            .intro { padding: 24px 0 64px; }
            .summary { font-size: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="{% url 'home' %}">MoneySite</a>
        <nav><a href="{% url 'admin:index' %}">Admin</a></nav>
    </header>
    <main>
        <section class="intro">
            <p class="eyebrow">Personal finance</p>
            <h1>A clearer view of your money.</h1>
            <p class="summary">Welcome to MoneySite. This is your starting page; change its text and styling in the home template.</p>
            <a class="action" href="{% url 'admin:index' %}">Open admin</a>
        </section>
    </main>
</body>
</html>
